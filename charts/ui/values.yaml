# Default values for ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1

publicApiUrl: "https://core-api.development.comissions.app"
auth:
  issuerBaseUrl: "https://dev-12mb5yq82dow1twh.us.auth0.com"
  clientId: "U39Jg6oyFoNihzjZ24SX2FxiBx2lqvsC"
  clientSecret: "UBH4HTsvkoWHImQwI4abyh46s6qpEnD3hfrODEYBTX7p_5v0bYogz-b_6wJtOkDg"
  baseUrl: "https://development.comissions.app"
  secret: "U39Jg6oyFoNihzjZ24SX2FxiBx2lqvsC"
  audience: "https://api.artplatform.com"
  scope: "openid profile email read:user write:user read:request write:request read:artist write:artist"

image:
  repository: ghcr.io/comissions-app/ui
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: ["comissions-app"]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem needs a writable volume for runtime temp writes
  # (e.g. the Next.js cache); enable once an emptyDir is mounted for those paths.
  # readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: comissions.dev
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
